name: Docker image

on:
  push:
    branches: [develop]
    tags: ['v*']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/radarr

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io

    steps:
      - uses: actions/checkout@v5

      - name: Compute version
        id: version
        run: |
          major=$(sed -n "s/^ *majorVersion: '\([0-9.]*\)'.*/\1/p" azure-pipelines.yml)
          if [ -z "$major" ]; then
            echo "could not read majorVersion from azure-pipelines.yml" >&2
            exit 1
          fi
          echo "version=${major}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Build stage cross-compiles natively; QEMU only runs the small runtime-stage apk step.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=radarr
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RADARRVERSION=${{ steps.version.outputs.version }}
            BRANCH=${{ steps.version.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
